name: Website regression checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check session, date, price and acceptance rules
        run: node --test tests/training.test.cjs
      - name: Check local links, catalog parity and closed camp routes
        run: python3 tests/check_site.py
