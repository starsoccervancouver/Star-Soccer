name: Deploy Star Soccer site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/site-checks.yml
    permissions:
      contents: read
  deploy:
    needs: checks
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage public website files
        run: |
          node scripts/check-form-endpoints.cjs
          node scripts/stage-site.cjs

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: ${{ env.PAGES_ARTIFACT }}

      - name: Verify uploaded package is available
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 12; attempt++) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: context.runId, per_page: 100
              });
              const matches = artifacts.filter(a => a.name === process.env.PAGES_ARTIFACT && !a.expired);
              if (matches.length === 1) {
                core.info('The current release package is available.');
                return;
              }
              if (matches.length > 1) throw new Error('Ambiguous release package; refusing to deploy.');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Uploaded package is not visible yet; retry this deployment job.');

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
