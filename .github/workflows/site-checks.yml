name: Website regression checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - name: Build optimized stylesheet and check generated output
        run: |
          pnpm build
          git diff --exit-code -- site.min.css
      - name: Check session, date, price and acceptance rules
        run: pnpm test
      - name: Check structured data against page metadata and program catalogs
        run: node scripts/build-search-data.cjs --check
      - name: Check local links, catalog parity and closed camp routes
        run: python3 tests/check_site.py
      - name: Install browser for responsive and form checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Check responsive pages, navigation, filters and mocked submissions
        run: |
          node tests/browser.cjs
          node tests/camp-audit-ui.cjs
      - name: Check private tactics editor, animation and session safety with fictional data
        run: |
          node tests/coach-tactics-ui.cjs
          node tests/coach-tactics-integration.cjs
      - name: Check coach settings, account views and browser preferences
        run: node tests/coach-settings-ui.cjs
      - name: Check day-first planning, private notes and tool drawers
        run: node tests/coach-planner-layout-ui.cjs
      - name: Check coach draft safety, notes and reusable session tools
        run: |
          node tests/coach-audit-safety-ui.cjs
          node tests/coach-notes-drawer-ui.cjs
          node tests/coach-reuse-budget-ui.cjs
      - name: Check focused session planning and private reusable drills
        run: |
          node tests/coach-focus-planner-ui.cjs
          node tests/coach-library-ui.cjs
          node tests/coach-profiles-ui.cjs

      - name: Check recurring groups, private player folders and dated workspace navigation
        run: |
          node tests/coach-folders-ui.cjs
          node tests/coach-group-workspace-ui.cjs
          node tests/coach-camps-ui.cjs
          node tests/coach-views-ui.cjs
